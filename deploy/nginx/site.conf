# nginx inside the landing-web container. Serves the static Next.js export.
# TLS, domains and redirects are handled by the backend's edge nginx
# (see deploy/backend-nginx.conf), which proxies here over the Docker network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /privacy → /privacy/index.html (trailingSlash export)
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # Hashed build assets never change
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML must revalidate so new deploys show up immediately
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    access_log off;
}
