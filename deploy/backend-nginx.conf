# Landing page (athlon-web repo, "landing-web" container)
server {
    listen 443 ssl;
    server_name athlongoapp.com;

    ssl_certificate     /etc/letsencrypt/live/athlongoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athlongoapp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Frame-Options         "DENY"            always;
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Resolve landing-web per request via Docker's DNS instead of at startup,
    # so this nginx (and the API it fronts) still boots if the landing
    # container is down or not deployed yet. Do NOT turn this into an
    # `upstream` block.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $landing http://landing-web:80;

    location / {
        proxy_pass          $landing;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;
        proxy_http_version  1.1;
    }
}

# www → apex
server {
    listen 443 ssl;
    server_name www.athlongoapp.com;

    ssl_certificate     /etc/letsencrypt/live/athlongoapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/athlongoapp.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://athlongoapp.com$request_uri;
}
